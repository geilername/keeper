name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (gofmt, vet, test -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Not a `services:` container: those can't take a command, and the image's
      # default config has JetStream off. The integration tests need `-js`.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.15.2-alpine -js -m 8222
          for _ in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true'; then exit 0; fi
            sleep 1
          done
          docker logs nats
          exit 1

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: NATS logs
        if: failure()
        run: docker logs nats

  scorer:
    name: Scorer (pytest in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A plain `docker build scorer/` builds the runtime target only, and
      # BuildKit skips the unused test stage. Build it explicitly and run it.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scorer
          target: test
          load: true
          tags: keeper-scorer-test
          cache-from: type=gha,scope=scorer
          cache-to: type=gha,scope=scorer,mode=max

      - name: pytest
        run: docker run --rm keeper-scorer-test

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scorer
          push: false
          cache-from: type=gha,scope=scorer

  services:
    name: List Go services
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          services="$(find cmd -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "$services"

  image:
    name: Image (${{ matrix.service }})
    needs: services
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: docker build --build-arg SERVICE=${{ matrix.service }} .
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: SERVICE=${{ matrix.service }}
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,scope=image-${{ matrix.service }},mode=max
