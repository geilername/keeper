# Keeper on Kubernetes. One release per namespace: services keep their plain
# names (ingest, nats, postgres ...) so in-cluster URLs match docker compose.

image:
  # Keeper images are <repository>/<app>:<tag>; kind-up.sh builds and loads
  # them into the kind node, so nothing is pulled.
  repository: keeper
  tag: dev
  pullPolicy: IfNotPresent

# Created by deploy/kind-up.sh from .env (never committed):
#   keeper-secrets: DASH0_ENDPOINT, DASH0_AUTH_TOKEN, DASH0_DATASET,
#                   DASH0_TRACE_URL (optional), CAMERA_FTP_PASSWORD,
#                   POSTGRES_PASSWORD, KEEPER_TOKEN_KEY (generated),
#                   ADOBE_CLIENT_ID, ADOBE_CLIENT_SECRET (optional until set)
#   keeper-tls:     tls.crt, tls.key (FTPES and the console's https listener)
secrets:
  name: keeper-secrets
  tlsName: keeper-tls
  # A hash of both secrets' contents (kind-up.sh sets it). It goes on the
  # pods that read them, so a changed secret or certificate rolls those pods;
  # env vars from secrets and the TLS certificate are only read at start.
  checksum: ""

# Pods run as uid/gid 1000 and share the spool through fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }

# The shared photo spool (ADR-3). ReadWriteOnce works on a single-node
# cluster such as kind because every pod runs on the same node. A multi-node
# cluster needs a ReadWriteMany class (NFS, EFS, CephFS) or object storage.
spool:
  size: 20Gi
  accessMode: ReadWriteOnce
  storageClass: ""

apps:
  ingest:
    port: 8080
    spool: rw
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  scorer:
    imageName: scorer
    spool: ro
    resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { memory: 1Gi } }
  culler:
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  publisher:
    spool: ro
    # Scratch space for rated copies of raws (one raw per photo in flight).
    scratchSize: 2Gi
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }
  gateway:
    port: 8080
    spool: ro
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  indexer:
    requires: search
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }

# The console, reachable from the LAN through kind's port mappings
# (deploy/kind/cluster.yaml): host 8090 -> node 30090, host 8443 -> node 30443.
console:
  nodePort: 30090
  https:
    enabled: true
    nodePort: 30443

# FTPES for the camera. Explicit TLS is required on control and data
# connections; the camera is set to ignore the self-signed certificate.
sftpgo:
  image: drakkan/sftpgo:v2.7.6
  controlPort: 2121
  controlNodePort: 32121
  # Passive data ports keep one number end to end (host = node = pod), because
  # SFTPGo advertises them to the camera. They must match deploy/kind/cluster.yaml.
  passivePorts: { start: 30100, end: 30109 }
  # The address the camera connects to for data: the Mac's LAN IP. Required.
  passiveIP: ""
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }

nats:
  image: nats:2.15.2-alpine
  storage: 2Gi
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }

postgres:
  image: postgres:18.6-alpine
  storage: 2Gi
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }

search:
  enabled: true
  image: elasticsearch:9.5.3
  heap: 512m
  storage: 5Gi
  resources: { requests: { cpu: 200m, memory: 1Gi }, limits: { memory: 1536Mi } }

collector:
  image: otel/opentelemetry-collector-contrib:0.165.0
  debugVerbosity: basic
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }

# Adobe Lightroom. The gateway runs the OAuth login ("Connect Lightroom" in
# the console) and keeps the token fresh; the publisher uploads into the
# collection picked in the console.
lightroom:
  redirectURI: https://localhost:8443/auth/lightroom/callback

# Off by default: the cluster publishes to the real Adobe Lightroom. Turn on
# only to test the cluster without Adobe credentials; it switches the
# publisher to the mock and shows the console's fault panel.
lightroomMock:
  enabled: false
