# Postgres: the ingest dedup table and the gateway read model, one schema each.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "keeper.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "keeper.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "keeper.selector" "postgres" | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70 # postgres in the alpine image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: keeper }
            - { name: POSTGRES_DB, value: keeper }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "keeper"] }
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "keeper.labels" . | nindent 4 }}
spec:
  selector: {{- include "keeper.selector" "postgres" | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
